<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskHub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header>
        <h1>TaskHub</h1>
        <p>Your tasks. Your work. Your way.</p>
    </header>


    <main>

        <!-- WELCOME -->
        <section class="welcome">
            <h2>Welcome to TaskHub 👋</h2>
            <p>Choose the field that best describes you.</p>
        </section>


        <!-- CATEGORIES -->
        <section class="fields">

            <button class="field" data-field="🎓 Student">
                🎓 Student
            </button>

            <button class="field" data-field="💼 Business">
                💼 Business
            </button>

            <button class="field" data-field="🌾 Farming">
                🌾 Farming
            </button>

            <button class="field" data-field="⚖️ Law">
                ⚖️ Law
            </button>

            <button class="field" data-field="👩‍🏫 Teacher">
                👩‍🏫 Teacher
            </button>

            <button class="field" data-field="🩺 Healthcare">
                🩺 Healthcare
            </button>

            <button class="field" data-field="💻 Technology">
                💻 Technology
            </button>

            <button class="field" data-field="🏠 Personal">
                🏠 Personal
            </button>

            <button class="field" data-field="➕ Other">
                ➕ Other
            </button>

        </section>


        <!-- TASK AREA -->
        <section class="task-area" id="taskArea">

            <!-- TASK HEADER -->
            <div class="task-header">

                <div>
                    <h2 id="fieldTitle">My Tasks</h2>

                    <p id="taskSubtitle">
                        Manage your tasks below.
                    </p>
                </div>

                <button id="clearCompleted" class="clear-btn">
                    🧹 Clear Completed
                </button>

            </div>


            <!-- STATISTICS -->
            <div class="stats">

                <div class="stat-card">
                    <span class="stat-number" id="totalTasks">
                        0
                    </span>

                    <span class="stat-label">
                        Total Tasks
                    </span>
                </div>


                <div class="stat-card">
                    <span class="stat-number" id="pendingTasks">
                        0
                    </span>

                    <span class="stat-label">
                        Pending
                    </span>
                </div>


                <div class="stat-card">
                    <span class="stat-number" id="completedTasks">
                        0
                    </span>

                    <span class="stat-label">
                        Completed
                    </span>
                </div>


                <div class="stat-card">
                    <span class="stat-number" id="progressPercent">
                        0%
                    </span>

                    <span class="stat-label">
                        Average Progress
                    </span>
                </div>

            </div>


            <!-- ADD TASK -->
            <div class="task-input">

                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter a task..."
                    maxlength="150"
                >


                <select id="priorityInput">

                    <option value="low">
                        🟢 Low
                    </option>

                    <option value="medium" selected>
                        🟡 Medium
                    </option>

                    <option value="high">
                        🔴 High
                    </option>

                </select>


                <input
                    type="date"
                    id="dueDateInput"
                >


                <button id="addTask">
                    + Add Task
                </button>

            </div>


            <!-- SEARCH -->
            <div class="task-tools">

                <div class="search-box">

                    <span>🔎</span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search tasks..."
                    >

                </div>


                <div class="filters">

                    <button
                        class="filter active"
                        data-filter="all"
                    >
                        All
                    </button>

                    <button
                        class="filter"
                        data-filter="pending"
                    >
                        Pending
                    </button>

                    <button
                        class="filter"
                        data-filter="completed"
                    >
                        Completed
                    </button>

                </div>

            </div>


            <!-- TASK LIST -->
            <ul id="taskList"></ul>

        </section>

    </main>


    <!-- EDIT TASK MODAL -->
    <div class="modal" id="editModal">

        <div class="modal-content">

            <div class="modal-header">

                <h3>
                    ✏️ Edit Task
                </h3>

                <button
                    id="closeModal"
                    class="close-modal"
                >
                    ×
                </button>

            </div>


            <label for="editTaskInput">
                Task
            </label>

            <input
                type="text"
                id="editTaskInput"
                placeholder="Enter task..."
            >


            <label for="editPriorityInput">
                Priority
            </label>

            <select id="editPriorityInput">

                <option value="low">
                    🟢 Low
                </option>

                <option value="medium">
                    🟡 Medium
                </option>

                <option value="high">
                    🔴 High
                </option>

            </select>


            <label for="editDueDateInput">
                Due Date
            </label>

            <input
                type="date"
                id="editDueDateInput"
            >


            <!-- EDIT PROGRESS -->
            <div class="edit-progress">

                <div class="edit-progress-header">

                    <label for="editProgressInput">
                        Progress
                    </label>

                    <span id="editProgressValue">
                        0%
                    </span>

                </div>


                <input
                    type="range"
                    id="editProgressInput"
                    min="0"
                    max="100"
                    value="0"
                >

            </div>


            <div class="modal-buttons">

                <button
                    id="cancelEdit"
                    class="cancel-btn"
                >
                    Cancel
                </button>

                <button
                    id="saveEdit"
                    class="save-btn"
                >
                    Save Changes
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
